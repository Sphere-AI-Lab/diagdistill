schedule_config_path: configs/shared_schedule.yaml
denoising_step_list:
- 1000
- 100
warp_denoising_step: true # need to remove - 0 in denoising_step_list if warp_denoising_step is true
use_diagonal_denoising: true
warmup_mid_steps_raw:
- 750
- 500
enable_torch_compile: true
torch_compile_mode: max-autotune-no-cudagraphs
torch_compile_suppress_errors: false
torch_compile_require_success: true
merge_lora_before_compile: true
use_taehv: true
taehv_checkpoint_path: taew2_1.pth
num_frame_per_block: 3
model_name: Wan2.1-T2V-1.3B
model_kwargs:
  local_attn_size: 12
  timestep_shift: 5.0
  sink_size: 3


# inference
data_path: prompts/prompts_10.txt
output_folder: videos/long
inference_iter: -1
num_output_frames: 21
use_ema: false
seed: 0
num_samples: 1
save_with_index: true
global_sink: true
context_noise: 0

generator_ckpt: outputs/20260315_212642/checkpoint_model_003500/model.pt
lora_ckpt: longlive_models/models/lora.pt

adapter:
  type: "lora"
  rank: 256                    # LoRA rank (typical values: 8, 16, 32, 64)
  alpha: 256                   # LoRA alpha (typically same as rank, but can be different)
  dropout: 0.0                # LoRA dropout rate
  dtype: "bfloat16"          # Data type for LoRA parameters: "bfloat16", "float16", "float32"
  verbose: false              # Whether to print all target module names
